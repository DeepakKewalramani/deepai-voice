# Fresh clones build with the macOS default deployment target (10.13), which
# makes C++ `<filesystem>` unavailable to whisper-rs/ggml. Pin 10.15 so
# `cargo tauri build` works out of the box on macOS.
[env]
MACOSX_DEPLOYMENT_TARGET = { value = "10.15", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = { value = "10.15", force = true }
