[package]
name = "deepai-voice"
version = "0.1.0"
description = "DeepAI Voice"
authors = ["DeepakKewalramani"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deepai_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
cpal = "0.18.2"
rubato = "5.0.1"
arboard = "3"
tauri-plugin-global-shortcut = "2"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6.2"
objc2-speech = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription"] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSLocale", "NSError", "NSOperation"] }
